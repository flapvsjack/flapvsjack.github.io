<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spooners Hub</title>
<meta name="description" content="Spooners Hub: raid coins, the shop and your Spooner.">
<meta name="theme-color" content="#0f6a8f">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root { --ink:#0a0f1f; --navy:#050b1f; --blue:#1f56d6; --bright:#1f6bff; --cyan:#7fe9ff; --pale:#9fd8ff; --white:#fff; --gold:#ffd34d; --bad:#ff7a8a; }
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; } html { overflow-x:hidden; }
body { font-family:'Barlow Condensed', system-ui, sans-serif; color:var(--white); background:var(--navy); overflow-x:hidden; }
a { color:var(--cyan); } a:hover { color:var(--white); }
button { font:inherit; color:inherit; }
:focus-visible { outline:3px solid var(--white); outline-offset:3px; }
.bg { position:fixed; inset:0; z-index:-1; overflow:hidden; background:radial-gradient(ellipse 60% 70% at 62% 48%, #1f56d6 0%, #0d2a7a 38%, #071438 70%, #050b1f 100%); }
.bg::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(-62deg, transparent 0 46px, rgba(255,255,255,.035) 46px 50px); }
.bg::after { content:""; position:absolute; right:-80px; top:-60px; width:760px; height:560px; transform:rotate(-12deg); background-image:radial-gradient(rgba(127,233,255,.16) 1.2px, transparent 1.6px); background-size:14px 14px; -webkit-mask-image:radial-gradient(closest-side, #000 30%, transparent 100%); mask-image:radial-gradient(closest-side, #000 30%, transparent 100%); }
.skew { transform:skewX(-12deg); } .unskew { display:inline-block; transform:skewX(12deg); }
.comic { font-family:Bangers, cursive; font-weight:400; letter-spacing:1.5px; }

header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:18px clamp(16px, 4vw, 56px); }
.brand { display:flex; align-items:baseline; gap:14px; text-decoration:none; color:var(--white); }
.word { font-family:Bangers, cursive; font-size:clamp(40px, 6vw, 58px); letter-spacing:2px; line-height:1; text-shadow:3px 3px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 7px 7px 0 var(--bright); }
.brand small { font-size:18px; font-weight:700; letter-spacing:4px; color:var(--pale); }
.stats { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.pill { display:flex; align-items:center; gap:10px; height:46px; padding:0 18px; background:var(--ink); border:3px solid var(--white); box-shadow:5px 5px 0 var(--bright); transform:skewX(-12deg); }
.pill > * { transform:skewX(12deg); }
.pill .k { font-size:12px; font-weight:700; letter-spacing:2px; color:var(--pale); line-height:1; }
.pill .v { font-size:22px; font-weight:800; line-height:1; }
.pill.btn { cursor:pointer; }
.pill.btn:hover { background:#13214a; }

.layout { display:grid; grid-template-columns:minmax(260px, 480px) minmax(220px, 1fr) minmax(280px, 400px); gap:clamp(16px, 3vw, 40px); padding:16px clamp(16px, 4vw, 56px) 40px; align-items:start; }
nav.menu { display:flex; flex-direction:column; gap:12px; }
.mb { all:unset; box-sizing:border-box; height:64px; display:flex; align-items:center; gap:18px; padding:0 26px; cursor:pointer; transform:skewX(-12deg); background:rgba(10,15,31,.72); border:3px solid rgba(255,255,255,.22); color:var(--white); transition:transform .16s ease, background .16s ease, box-shadow .16s ease; }
.mb > * { transform:skewX(12deg); }
.mb svg { flex:none; }
.mb .nm { font-family:Bangers, cursive; font-size:36px; letter-spacing:1.5px; line-height:1; white-space:nowrap; }
.mb .tg { white-space:nowrap; }
.mb .tg { margin-left:auto; font-size:15px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--cyan); }
.mb[aria-pressed="true"] { background:var(--white); color:#0a1a4d; border-color:var(--ink); box-shadow:7px 7px 0 var(--bright), 0 0 34px rgba(127,233,255,.55); transform:skewX(-12deg) translateX(26px); }
.mb[aria-pressed="true"] .tg { color:var(--blue); }
.mb:focus-visible { outline:3px solid var(--white); outline-offset:4px; }

.hero { position:relative; display:flex; flex-direction:column; align-items:center; padding-top:20px; }
.hero .glow { position:absolute; top:30px; width:min(360px, 80vw); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle, rgba(127,233,255,.55) 0%, rgba(55,184,255,.18) 45%, transparent 70%); }
.hero .ring { position:absolute; top:64px; width:min(290px, 64vw); aspect-ratio:1; border-radius:50%; border:3px dashed rgba(255,255,255,.35); animation:spin 40s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.hero canvas.spc { position:relative; width:min(250px, 56vw); height:auto; aspect-ratio:500 / 560; cursor:pointer; }
.hero svg.sp { position:relative; width:min(250px, 56vw); height:auto; animation:bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform:translateY(-8px); } }
.plate { position:relative; margin-top:-6px; transform:skewX(-12deg); background:var(--white); color:#0a1a4d; border:3px solid var(--ink); box-shadow:6px 6px 0 var(--bright); padding:8px 28px; text-align:center; }
.plate > * { transform:skewX(12deg); }
.plate .n { font-family:Bangers, cursive; font-size:32px; letter-spacing:1.5px; line-height:1; }
.plate .r { font-size:15px; font-weight:800; letter-spacing:2px; color:var(--blue); }
.aura { position:relative; margin-top:16px; width:min(280px, 80vw); }
.aura .lab { display:flex; justify-content:space-between; font-size:14px; font-weight:700; letter-spacing:2px; color:var(--pale); }
.aura .bar { height:14px; margin-top:6px; background:var(--ink); border:2px solid var(--white); transform:skewX(-12deg); overflow:hidden; }
.aura .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--bright), var(--cyan)); transition:width .6s ease; }

.detail .card { transform:skewX(-6deg); background:var(--ink); border:3px solid var(--white); box-shadow:8px 8px 0 var(--bright); }
.detail .in { transform:skewX(6deg); padding:24px 28px 26px; }
.kick { font-size:15px; font-weight:800; letter-spacing:3px; color:var(--cyan); }
.detail h1 { margin:4px 0 0; font-family:Bangers, cursive; font-weight:400; font-size:clamp(46px, 5vw, 62px); letter-spacing:2px; line-height:.95; text-shadow:4px 4px 0 var(--blue); }
.bubble { margin-top:16px; background:var(--white); color:#0a1a4d; padding:14px 18px; border:3px solid var(--ink); font-size:20px; font-weight:600; line-height:1.25; }
.facts { margin-top:16px; display:flex; flex-direction:column; gap:8px; }
.fact { display:flex; justify-content:space-between; align-items:baseline; gap:12px; border-bottom:2px solid rgba(255,255,255,.14); padding-bottom:6px; }
.fact .k { font-size:16px; font-weight:700; letter-spacing:2px; color:var(--pale); text-transform:uppercase; }
.fact .v { font-size:21px; font-weight:800; text-align:right; }
.cta { all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:12px; margin:24px 0 0 auto; min-width:240px; height:62px; padding:0 22px; transform:skewX(-12deg); background:var(--white); color:#0a1a4d; border:3px solid var(--ink); box-shadow:6px 6px 0 var(--bright); text-decoration:none; transition:transform .12s ease; }
.cta > * { transform:skewX(12deg); }
.cta .comic { font-size:32px; letter-spacing:2px; white-space:nowrap; }
.cta:hover { transform:skewX(-12deg) translateY(-2px); color:#0a1a4d; }
.cta[disabled] { opacity:.5; cursor:default; }
.list { margin-top:16px; display:flex; flex-direction:column; gap:10px; max-height:46vh; overflow:auto; padding-right:4px; }
.item { display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; padding:10px 12px; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.14); }
.item { grid-template-columns:auto 1fr auto; }
.item .th { width:56px; height:56px; object-fit:contain; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.14); }
.item .th.blank { display:grid; place-items:center; font-size:26px; }
.item b { font-size:20px; } .item small { color:var(--pale); font-size:14px; letter-spacing:1px; text-transform:uppercase; }
.item .buy { all:unset; cursor:pointer; padding:6px 14px; background:var(--white); color:#0a1a4d; font-weight:800; font-size:17px; border:2px solid var(--ink); box-shadow:3px 3px 0 var(--bright); }
.item .buy[disabled] { opacity:.45; cursor:default; }
.lv { display:flex; gap:3px; grid-column:2 / -1; }
.sws { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.sw { all:unset; cursor:pointer; width:24px; height:24px; border:2px solid rgba(255,255,255,.5); display:grid; place-items:center; font-size:13px; color:var(--pale); background:transparent; transform:skewX(-12deg); }
.sw.on { outline:3px solid var(--white); outline-offset:2px; border-color:var(--ink); }
.sw:focus-visible { outline:3px solid var(--cyan); outline-offset:2px; }
.cz { display:grid; grid-template-columns:90px 1fr; align-items:center; gap:8px; margin-top:8px; font-size:17px; font-weight:700; }
.item .buy[aria-pressed="true"] { background:var(--cyan); }
.lv i { flex:1; height:6px; background:rgba(255,255,255,.15); } .lv i.on { background:var(--cyan); }
.code { font-family:Bangers, cursive; font-size:54px; letter-spacing:8px; text-align:center; color:var(--ink); background:var(--gold); border:3px solid var(--ink); margin-top:14px; padding:4px 0; }
.note { font-size:17px; color:var(--pale); margin-top:12px; line-height:1.3; }
.err { color:var(--bad); }

.signin { position:fixed; inset:0; display:grid; place-items:center; background:rgba(2,6,20,.7); z-index:50; }
.signin[hidden] { display:none; }
.signin .card { transform:skewX(-6deg); background:var(--ink); border:3px solid var(--white); box-shadow:8px 8px 0 var(--bright); width:min(420px, 92vw); }
.signin .in { transform:skewX(6deg); padding:24px 28px; display:flex; flex-direction:column; gap:12px; }
.prov { all:unset; cursor:pointer; display:flex; align-items:center; gap:14px; padding:12px 18px; background:var(--white); color:#0a1a4d; border:3px solid var(--ink); box-shadow:5px 5px 0 var(--bright); font-size:22px; font-weight:800; }
.prov:hover { transform:translateY(-2px); }
.x { all:unset; cursor:pointer; align-self:flex-end; font-size:15px; color:var(--pale); letter-spacing:2px; }

.toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) skewX(-12deg); background:var(--white); color:#0a1a4d; border:3px solid var(--ink); box-shadow:6px 6px 0 var(--bright); padding:10px 26px; font-size:22px; font-weight:800; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; }
.toast.on { opacity:1; }
.chests { position:fixed; inset:0; z-index:55; display:grid; place-items:center; pointer-events:none; }
.chests[hidden] { display:none; }
.chests .row { display:flex; gap:28px; }
.chest { width:120px; animation:drop .6s cubic-bezier(.3,1.6,.5,1) both; }
.chest svg { width:100%; overflow:visible; filter:drop-shadow(0 6px 0 rgba(0,0,0,.45)); }
.chest .lid { transform-origin:8% 46%; transition:transform .3s cubic-bezier(.3,1.8,.5,1); }
.chest.open .lid { transform:rotate(-38deg) translateY(-4px); }
.chest .shine { opacity:0; transition:opacity .2s; } .chest.open .shine { opacity:.95; }
.chests .total { margin-top:22px; text-align:center; font-family:Bangers, cursive; font-size:64px; letter-spacing:3px; color:var(--gold); -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:5px 5px 0 var(--ink); }
@keyframes drop { 0% { transform:translateY(-120vh); } 70% { transform:translateY(0) scale(1.08, .9); } 100% { transform:none; } }

footer { padding:0 clamp(16px, 4vw, 56px) 28px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:16px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--pale); }
footer a { text-decoration:none; }

/* Latest update (written in Cutroom › Webpage › News & updates) */
.latest { box-sizing:border-box; position:relative; display:block; margin-top:22px; width:min(300px, 86vw); transform:skewX(-6deg); background:var(--ink); border:3px solid var(--white); box-shadow:6px 6px 0 var(--bright); }
.latest[hidden] { display:none; }
.latest > div { transform:skewX(6deg); padding:12px 16px 14px; }
.latest .k { display:flex; justify-content:space-between; gap:10px; font-size:13px; font-weight:800; letter-spacing:2px; color:var(--cyan); }
.latest h3 { margin:4px 0 4px; font-family:Bangers, cursive; font-weight:400; font-size:26px; letter-spacing:1px; line-height:1; }
.latest p { margin:0; font-size:17px; line-height:1.25; color:var(--pale); white-space:pre-line; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.latest.open p { -webkit-line-clamp:unset; }
.latest a, .latest .more { color:var(--cyan); font-weight:800; }
.latest .more { all:unset; cursor:pointer; margin-top:6px; font-size:15px; letter-spacing:1px; }
.latest .more:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
.latest .row2 { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin-top:4px; }
@media (max-width:1100px) { .layout { grid-template-columns:minmax(240px, 420px) 1fr; } .hero { grid-column:1 / -1; order:-1; } }
@media (max-width:700px) {
  .layout { grid-template-columns:1fr; }
  .mb { height:56px; } .mb .nm { font-size:30px; } .mb[aria-pressed="true"] { transform:skewX(-12deg) translateX(10px); }
  .cta { width:100%; margin-left:0; }
  .detail { padding-right:10px; } .mb .tg { font-size:13px; letter-spacing:1px; }
  .chest { width:84px; } .chests .row { gap:12px; }
}
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

/* ===== Theme: same look as the main site =====
   Blue leads, white is the accent, deep-blue seams and hard offset shadows, slanted plates.
   Chakra Petch (italic, uppercase) for headings, Figtree for text, JetBrains Mono for numbers. */
:root { --a:#1787b4; --a-deep:#0f6a8f; --ink:#0b2533; --navy:#0f6a8f; --blue:#1787b4; --bright:#0f6a8f; --cyan:#3ee6ff; --pale:#d6eef8; --pink:#ff4fa3;
  --display:"Chakra Petch", ui-sans-serif, system-ui, sans-serif; --text:"Figtree", ui-sans-serif, system-ui, "Segoe UI", sans-serif; --mono:"JetBrains Mono", ui-monospace, Consolas, monospace; }
body { font-family:var(--text); background:var(--a); }
.comic, .word, .mb .nm, .plate .n, .detail h1, .code, .chests .total, .latest h3, .cta .comic { font-family:var(--display); font-weight:700; font-style:italic; text-transform:uppercase; letter-spacing:0; }
/* background: the blue panel with fine stripes, and a white slanted plate behind your Spooner */
.bg { background:var(--a); }
.bg::before { background:repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 2px, transparent 2px 28px); }
.bg::after { display:none; }
.hero::before { content:""; position:absolute; z-index:0; top:-16px; bottom:-24px; left:50%; width:min(310px, 74vw); transform:translateX(-50%) skewX(-8deg);
  background:#fff; box-shadow:-8px 0 0 var(--a-deep), 8px 0 0 var(--a-deep); }
.hero > * { position:relative; z-index:1; }
.hero .glow { background:radial-gradient(circle, rgba(23,135,180,.30) 0%, rgba(23,135,180,.10) 45%, transparent 70%); }
.hero .ring { border-color:rgba(15,106,143,.35); }
.aura .lab { color:var(--ink); font-weight:800; }
.aura .bar { border-color:var(--ink); background:#e6f2f8; }
.aura .bar i { background:repeating-linear-gradient(115deg, var(--a) 0 12px, var(--a-deep) 12px 24px); }
/* top bar, like the main site */
header.topbar { position:sticky; top:0; z-index:40; background:var(--a-deep); border-bottom:1px solid rgba(255,255,255,.15); padding:10px clamp(16px, 4vw, 56px); gap:18px; }
.brand { align-items:center; gap:10px; }
.brand-logo { width:36px; height:36px; border-radius:50%; flex:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
.word { font-size:24px; text-shadow:none; color:#fff; }
.brand small { font-family:var(--mono); font-size:12px; letter-spacing:3px; color:var(--pale); }
.sitenav { display:flex; gap:2px; margin-right:auto; }
.sitenav a { font:600 14px/1 var(--text); color:#fff; text-decoration:none; padding:9px 10px; border-radius:6px; }
.sitenav a:hover { background:rgba(255,255,255,.16); color:#fff; }
@media (max-width:760px) { .sitenav { display:none; } }
.pill { height:40px; background:var(--ink); border:2px solid #fff; box-shadow:4px 4px 0 var(--ink); }
.pill .k { font-family:var(--mono); font-size:10px; }
.pill .v { font-family:var(--mono); font-size:17px; font-weight:700; }
.pill.btn { background:#fff; color:var(--a-deep); box-shadow:4px 4px 0 var(--ink); }
.pill.btn:hover { background:#e6f2f8; }
/* menu: slanted plates; the picked one turns white and slides right */
.mb { height:60px; background:rgba(11,37,51,.55); border:2px solid rgba(255,255,255,.35); transition:transform .3s cubic-bezier(.2,.8,.2,1), background .2s ease, box-shadow .2s ease; }
.mb:hover { background:rgba(11,37,51,.75); transform:skewX(-12deg) translateX(8px); }
.mb .nm { font-size:26px; }
.mb .tg { font-family:var(--mono); font-size:12px; letter-spacing:1.5px; color:var(--pale); }
.mb[aria-pressed="true"] { background:#fff; color:var(--ink); border-color:#fff; box-shadow:8px 8px 0 var(--ink); transform:skewX(-12deg) translateX(26px); }
.mb[aria-pressed="true"] .tg { color:var(--a); }
/* name plate under your Spooner */
.plate { background:var(--a); color:#fff; border:2px solid var(--ink); box-shadow:6px 6px 0 var(--ink); }
.plate .n { font-size:26px; }
.plate .r { font-family:var(--mono); font-size:12px; color:#fff; opacity:.9; }
/* right-hand detail card: dark like the "next stream" card */
.detail .card { background:var(--ink); border:2px solid var(--ink); box-shadow:10px 10px 0 var(--a-deep); }
.kick { font-family:var(--mono); font-size:12px; color:var(--cyan); }
.detail h1 { font-size:clamp(36px, 4vw, 50px); line-height:1; text-shadow:3px 3px 0 var(--a); }
.bubble { border-color:#fff; color:var(--ink); font-size:17px; font-weight:500; border-radius:4px; }
.fact .k { font-family:var(--mono); font-size:12px; }
.fact .v { font-family:var(--mono); font-size:17px; }
.cta { height:56px; background:#fff; color:var(--a-deep); border:2px solid #fff; box-shadow:6px 6px 0 var(--a); }
.cta .comic { font-size:24px; }
.cta:hover { color:var(--a-deep); }
.item { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.16); border-left:4px solid var(--a); }
.item b { font-size:17px; } .item small { font-family:var(--mono); font-size:11px; }
.item .buy { background:var(--a); color:#fff; border:0; box-shadow:3px 3px 0 #000; font-size:15px; border-radius:2px; }
.item .buy[aria-pressed="true"] { background:#fff; color:var(--a-deep); }
.lv i.on { background:var(--a); }
.code { font-family:var(--mono); font-style:normal; font-size:44px; letter-spacing:10px; }
.note { font-size:15px; }
/* sign-in, toast, chests, latest update */
.signin { background:rgba(11,37,51,.72); }
.signin .card { border:2px solid #fff; box-shadow:10px 10px 0 var(--a); }
.signin h1.comic { font-size:34px !important; text-shadow:3px 3px 0 var(--a) !important; }
.prov { border:2px solid #fff; box-shadow:5px 5px 0 var(--a); font-size:18px; }
.x { font-family:var(--mono); font-size:12px; }
.toast { color:var(--ink); border:2px solid var(--ink); box-shadow:6px 6px 0 var(--a-deep); font-size:18px; }
.chests .total { font-size:56px; }
.latest { border:2px solid var(--ink); box-shadow:6px 6px 0 var(--a-deep); }
.latest .k { font-family:var(--mono); font-size:11px; }
.latest h3 { font-size:22px; }
.latest p { font-size:15px; }
body { display:flex; flex-direction:column; min-height:100vh; } main.layout { flex:1; }
footer { background:var(--a-deep); padding-top:18px; font-family:var(--mono); font-size:12px; }
footer a { color:#fff; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<header class="topbar">
  <a class="brand" href="./"><img class="brand-logo" src="assets/logo.png" alt="" width="36" height="36"><span class="word" id="word">SPOONERS</span><small>HUB</small></a>
  <nav class="sitenav" aria-label="Main site"><a href="./">Home</a><a href="./#discord">Discord</a><a href="./#schedule">Schedule</a></nav>
  <div class="stats">

  <div class="kick">SIGN IN</div><h1 class="comic" style="margin:0;font-size:44px;text-shadow:4px 4px 0 var(--blue)">COLLECT YOUR COINS</h1>
  <p class="note" style="margin:0">Use the account you play raids with. YouTube viewers: sign in with any of these, then use a <b>!link</b> code.</p>

</div></div></div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ICON = {
    raids: "M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2",
    horde: "M12 3a7 7 0 00-7 7v3l2 2v3h3v-2h4v2h3v-3l2-2v-3a7 7 0 00-7-7zM9 11h.01M15 11h.01",
    character: "M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0",
    shop: "M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2",
    loot: "M3 10h18v10H3zM3 10l2-5h14l2 5M12 10v4M10 14h4",
    link: "M10 14a4 4 0 005.66 0l3-3a4 4 0 00-5.66-5.66l-1 1M14 10a4 4 0 00-5.66 0l-3 3a4 4 0 005.66 5.66l1-1",
    discord: "M4 5h16v11H9l-5 4z",
    schedule: "M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"
  };
  // default menu (Cutroom › Webpage › Spooners Hub menu changes these)
  const DEFAULT_ENTRIES = [
    { key: "raids", name: "RAIDS", tag: "Live", kicker: "TEAM UP IN CHAT", desc: "Join the stream raid and fight the boss together with chat commands. Beat it and everyone gets 3 big chests of coins.", show: true },
    { key: "horde", name: "HORDE", tag: "Live", kicker: "SURVIVE THE WAVES", desc: "Robot waves grow every round. Hold the line together: survive every third wave and everyone still standing gets a big chest of coins.", show: true },
    { key: "character", name: "CHARACTER", tag: "", kicker: "BUILD YOUR SPOONER", desc: "Pick what your Spooner wears and colour it. Save, and your stream avatar wears it too.", show: true },
    { key: "shop", name: "SHOP", tag: "Coins", kicker: "SPEND YOUR COINS", desc: "Buy colours, add-ons and companions. Each cosmetic levels up to 10 as you chat, battle and use emotes, and every level raises your Aura.", show: true },
    { key: "loot", name: "LOOT", tag: "", kicker: "RAID REWARDS", desc: "Every boss you help beat drops 3 big chests of coins. Sign in to collect them.", show: true },
    { key: "link", name: "LINK CHAT", tag: "YT · TW", kicker: "YOUTUBE & TWITCH", desc: "Played raids from YouTube or Twitch chat? Get a code here and type it in chat during a stream. Your coins from that name become yours.", show: true },
    { key: "discord", name: "DISCORD", tag: "", kicker: "ONIONS SPOON ALLIANCE", desc: "Hang out with the community, watch streams and catch raid alerts.", show: true },
    { key: "schedule", name: "SCHEDULE", tag: "", kicker: "NEXT STREAM", desc: "See when the next stream and raid go live.", show: true }
  ];
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const PROV = { discord: ["Discord", "#5865F2"], twitch: ["Twitch", "#9146FF"], google: ["Google", "#ffffff"] };
  let ECON = null;   // Supabase part 7: tiers, ranks, check-in (Cutroom › Spooners › Economy)
  let SITE = {}, ENTRIES = DEFAULT_ENTRIES, sel = 0, sb = null, user = null, me = { coins: null, aura: 0 }, shop = [], owned = {}, loot = [], links = [], code = null, codeTimer = null;

  function toast(t, ms = 2600) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), ms); }
  const nf = n => Number(n || 0).toLocaleString();

  // ---------------------------------------------------------------- menu
  function renderMenu() {
    const vis = ENTRIES.filter(e => e.show !== false);
    if (sel >= vis.length) sel = 0;
    $("menu").innerHTML = vis.map((e, i) => `<button class="mb" type="button" data-i="${i}" aria-pressed="${i === sel}">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[e.key] || ICON.raids}"/></svg>
      <span class="nm">${esc(e.name)}</span><span class="tg">${esc(tagFor(e))}</span></button>`).join("");
    renderDetail();
  }
  function tagFor(e) {
    if (e.key === "loot" && user && ECON && !checkedIn()) return "CHECK IN";
    if (e.key === "loot" && loot.length) return loot.length + " won";
    if (e.key === "link" && links.length) return links.length + " linked";
    return e.tag || "";
  }
  $("menu").addEventListener("click", ev => { const b = ev.target.closest(".mb"); if (!b) return; sel = +b.dataset.i; renderMenu(); });
  $("menu").addEventListener("mouseover", ev => { const b = ev.target.closest(".mb"); if (b && +b.dataset.i !== sel && matchMedia("(hover:hover)").matches) { sel = +b.dataset.i; [...$("menu").children].forEach((x, i) => x.setAttribute("aria-pressed", i === sel)); renderDetail(); } });
  const fact = (k, v) => `<div class="fact"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
  const cta = (txt, attrs) => `<button class="cta" type="button" ${attrs || ""}><span class="comic">${esc(txt)}</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>`;
  const ctaLink = (txt, href) => href ? `<a class="cta" href="${esc(href)}" target="_blank" rel="noopener"><span class="comic">${esc(txt)}</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>` : "";
  function renderDetail() {
    const e = ENTRIES.filter(x => x.show !== false)[sel]; if (!e) return;
    let body = "";
    if (e.key === "raids") {
      const r = SITE.raids || {};
      body = fact("When", esc(r.when || "Weekends on Discord")) + (r.modes || []).slice(0, 4).map(m => fact("Mode", esc(m.name))).join("") + fact("Victory reward", "3 big chests each");
      body = `<div class="facts">${body}</div>` + ctaLink("JOIN THE RAID", (SITE.links || {}).discord);
    } else if (e.key === "horde") {
      const r = SITE.raids || {}, hm = (r.modes || []).find(m => /horde/i.test(m.name || ""));
      body = `<div class="facts">${fact("When", esc(r.when || "Weekends on Discord"))}${fact("Waves", "Bigger every round")}${fact("Commands", "!shoot · !slash · !grenade")}${fact("Survive a wave", "+2 points")}${fact("Every 3rd wave", "1 big chest each")}${hm && hm.text ? fact("Lose", "Everyone down = back to wave 1") : ""}</div>` + ctaLink("JOIN THE RAID", (SITE.links || {}).discord);
    } else if (e.key === "shop") body = shopHtml();
    else if (e.key === "loot") body = lootHtml();
    else if (e.key === "link") body = linkHtml();
    else if (e.key === "discord") body = `<div class="facts">${fact("Server", esc(SITE.community || "OnionS Spoon Alliance"))}${(SITE.discord || {}).voiceChannel ? fact("Raid voice channel", esc(SITE.discord.voiceChannel)) : ""}</div>` + ctaLink("OPEN DISCORD", (SITE.links || {}).discord);
    else if (e.key === "schedule") body = `<div class="facts">${(SITE.schedule || []).filter(s => s.status !== "cancelled").slice(0, 6).map(s => fact(DAYS[s.day] + " " + (s.start || ""), esc(s.game || "TBA"))).join("") || fact("Schedule", "Coming soon")}</div>` + `<a class="cta" href="./#schedule"><span class="comic">FULL SCHEDULE</span></a>`;
    else if (e.key === "character") body = creatorHtml();
    else body = `<div class="facts">${fact("Status", "Coming soon")}</div>`;
    $("detail").innerHTML = `<div class="kick">${esc(e.kicker)}</div><h1>${esc(e.name)}</h1><div class="bubble">${esc(e.desc)}</div>${body}`;
  }
  function needSignIn(what) { return `<p class="note">Sign in to ${what}.</p>` + cta("SIGN IN", 'data-act="signin"'); }
  function thumb(id) {
    const p = SPD && SPD.parts && SPD.parts[id];
    return p ? `<img class="th" src="spooners/${esc(p.src)}" alt="" loading="lazy">` : `<span class="th blank" aria-hidden="true">✨</span>`;
  }
  const TIER_ORDER = ["common", "uncommon", "rare", "legendary"];
  function tierOf(it) { return ECON && ECON.tiers && ECON.tiers[it.tier] ? ECON.tiers[it.tier] : null; }
  function lockOf(it) {
    const t = tierOf(it); if (!t || !user) return "";
    const need = t.aura_rank_required || 0;
    if ((me.rank || 0) < need) return "NEEDS " + String((ECON.aura_ranks[need] || {}).name || "RANK " + need).toUpperCase() + " AURA";
    if (it.min_level && (me.level || 1) < it.min_level) return "NEEDS LV " + it.min_level;
    return "";
  }
  function nextUnlock(it, lv) {
    const u = it.unlocks || {}, k = Object.keys(u).map(Number).filter(n => n > lv).sort((a, b) => a - b)[0];
    return k ? `next: ${esc(u[k])} at lv ${k}` : "";
  }
  function shopHtml() {
    if (!sb) return `<p class="note">The shop opens soon.</p>`;
    if (!shop.length) return `<p class="note">Nothing in the shop yet. New cosmetics drop soon.</p>`;
    const list = ECON ? shop.slice().sort((a, b) => TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier) || a.price - b.price) : shop;
    return `<div class="list">${list.map(it => {
      const o = owned[it.id], lv = o ? o.level : 0, t = tierOf(it), lock = o ? "" : lockOf(it);
      const chip = t ? `<span style="display:inline-block;background:${esc(t.color || "#9fb3c8")};color:#0a0f1f;border:2px solid #0a0f1f;border-radius:6px;padding:0 6px;font-size:11px;font-weight:900;letter-spacing:1px;margin-right:6px">${esc(String(t.label).toUpperCase())}</span>` : "";
      const sub = o ? "level " + lv + "/" + it.max_level + (nextUnlock(it, lv) ? " · " + nextUnlock(it, lv) : "") : esc(it.description || it.category || "cosmetic");
      const btn = o ? `<small>OWNED</small>` : lock ? `<button class="buy" type="button" disabled title="${esc(lock)}">🔒 ${nf(it.price)}</button>`
        : `<button class="buy" type="button" data-buy="${esc(it.id)}" ${!user || (me.coins ?? 0) < it.price ? "disabled" : ""}>🪙 ${nf(it.price)}</button>`;
      return `<div class="item">${thumb(it.id)}<div>${chip}<b>${esc(it.name)}</b><br><small>${sub}${lock ? ` · <b style="color:#ff8b9b">${esc(lock)}</b>` : ""}</small></div>
        ${btn}
        ${o ? `<div class="lv">${Array.from({ length: it.max_level }, (_, i) => `<i class="${i < lv ? "on" : ""}"></i>`).join("")}</div>` : ""}</div>`;
    }).join("")}</div>${user ? "" : needSignIn("buy cosmetics")}`;
  }
  // ---------------------------------------------------------------- the character creator
  const SW = ["#ff4f8b", "#ff3b3b", "#ff8a2a", "#ffd34d", "#56d97b", "#2fd4c4", "#37b8ff", "#1f56d6", "#8a5cff", "#ffffff", "#2a2d3a"];
  let look = { paint: {} }, lookDirty = false;
  function swatches(attr, id, cur) {
    return `<div class="sws">${[""].concat(SW).map(c => `<button type="button" class="sw${(cur || "") === c ? " on" : ""}" ${attr}="${esc(id)}" data-c="${c}" aria-label="${c ? "Colour " + c : "As drawn"}" aria-pressed="${(cur || "") === c}" style="${c ? "background:" + c : ""}">${c ? "" : "✕"}</button>`).join("")}</div>`;
  }
  function bodyZones() {
    const d = SPD && SPD.characters && SPD.characters[baseId()]; if (!d) return [];
    const z = d.layers.filter(l => l.zone).map(l => ({ id: l.id, name: l.zone }));
    if (z.length) return z;
    const root = d.layers.find(l => !l.parent) || d.layers[0]; return root ? [{ id: root.id, name: "Body" }] : [];
  }
  function creatorHtml() {
    if (!user) return needSignIn("dress your Spooner");
    const zones = bodyZones(), mine = shop.filter(it => owned[it.id]).concat(Object.keys(owned).filter(id => !shop.some(s => s.id === id)).map(id => ({ id, name: id })));
    let h = "";
    if (zones.length) h += `<div class="kick" style="margin-top:16px">BODY COLOUR</div>` + zones.map(z => `<div class="cz"><span>${esc(z.name)}</span>${swatches("data-paint", z.id, look.paint[z.id])}</div>`).join("");
    h += `<div class="kick" style="margin-top:16px">WEARING</div>`;
    h += mine.length ? `<div class="list">${mine.map(it => { const o = owned[it.id], on = o.worn !== false;
      return `<div class="item">${thumb(it.id)}<div><b>${esc(it.name)}</b><br><small>level ${o.level || 1}</small></div>
        <button class="buy" type="button" data-wear="${esc(it.id)}" aria-pressed="${on}">${on ? "WEARING" : "WEAR"}</button>
        <div style="grid-column:2 / -1">${swatches("data-color", it.id, o.color)}</div></div>`; }).join("")}</div>`
      : `<p class="note">You don't own any cosmetics yet. Win raid chests, then pick something in the SHOP.</p>`;
    return h + cta(lookDirty ? "SAVE MY LOOK" : "SAVED", 'data-act="save"' + (lookDirty ? "" : " disabled"));
  }
  async function saveLook(btn) {
    if (!lookDirty || !user) return; btn.disabled = true;
    const items = Object.values(owned).map(o => ({ item: o.item_id, worn: o.worn !== false, color: o.color || null }));
    const { error } = await sb.rpc("save_look", { items, paint: look.paint });
    if (error) { toast(error.message, 4000); btn.disabled = false; return; }
    lookDirty = false; renderDetail(); toast("Saved! Your stream avatar updates within 2 minutes.", 3600);
  }
  function todayHere() { try { return new Date().toLocaleDateString("en-CA", { timeZone: (ECON && ECON.timezone) || "America/Chicago" }); } catch (e) { return new Date().toISOString().slice(0, 10); } }
  function checkedIn() { return !!me.last_checkin && String(me.last_checkin).slice(0, 10) === todayHere(); }
  function checkinHtml() {
    if (!ECON || !user) return "";
    const c = ECON.checkin || {}, done = checkedIn(), streak = me.streak || 0;
    let yday = ""; try { yday = new Date(Date.now() - 864e5).toLocaleDateString("en-CA", { timeZone: ECON.timezone || "America/Chicago" }); } catch (e) { /* */ }
    const nextDay = done || String(me.last_checkin || "").slice(0, 10) === yday ? streak + 1 : 1, cyc = ((nextDay - 1) % (c.streak_max_days || 7)) + 1;
    const amount = (c.base || 0) + (c.streak_step || 0) * (cyc - 1) + (cyc === (c.streak_max_days || 7) ? (c.day7_bonus || 0) : 0);
    const ways = Object.values(ECON.earn || {}).filter(w => w.category !== "gift").slice(0, 6).map(w => fact(w.label, w.coins ? "🪙 " + nf(w.coins) : w.max ? "up to 🪙 " + nf((w.max || 0) * (w.chests || 1)) : "XP")).join("");
    return `<div class="kick" style="margin-top:6px">DAILY CHECK-IN · STREAK ${streak}</div>` +
      (done ? `<p class="note">Checked in today. Come back tomorrow for 🪙 ${nf(amount)}.</p>` : cta("CHECK IN · +" + nf(amount) + " COINS", 'data-act="checkin"')) +
      `<div class="kick" style="margin-top:16px">MORE WAYS TO EARN</div><div class="facts">${ways}</div>`;
  }
  function lootHtml() {
    if (!user) return needSignIn("collect your raid chests");
    return checkinHtml() + lootList();
  }
  function lootList() {
    if (!loot.length) return `<p class="note">No chests yet. Help beat a raid boss and they show up here. YouTube or Twitch? Use LINK CHAT first.</p>` + cta("CHECK FOR NEW CHESTS", 'data-act="claim"');
    return `<div class="list">${loot.map(l => `<div class="item"><div><b>${esc(l.boss || "Raid boss")}</b><br><small>${new Date(l.won_at).toLocaleDateString()} · ${esc(l.platform)} · ${l.chests} chests</small></div><b>🪙 ${nf(l.coins)}</b></div>`).join("")}</div>` + cta("CHECK FOR NEW CHESTS", 'data-act="claim"');
  }
  function linkHtml() {
    if (!user) return needSignIn("get your link code");
    const list = links.length ? `<div class="facts">${links.map(l => fact(l.platform, esc(l.login))).join("")}</div>` : "";
    if (code) return `<div class="code" aria-label="Your code">${esc(code)}</div><p class="note">During a stream, type <b>!link ${esc(code)}</b> in YouTube or Twitch chat. This page updates by itself when it works (the code lasts 30 minutes).</p>${list}`;
    return list + cta("GET MY CODE", 'data-act="code"');
  }
  $("detail").addEventListener("click", async ev => {
    const b = ev.target.closest("[data-act],[data-buy],[data-wear],[data-color],[data-paint]"); if (!b) return;
    if (b.dataset.act === "signin") openSignIn();
    if (b.dataset.act === "claim") claim(true);
    if (b.dataset.act === "checkin") checkin(b);
    if (b.dataset.act === "code") newCode();
    if (b.dataset.buy) buy(b.dataset.buy, b);
    if (b.dataset.act === "save") saveLook(b);
    if (b.dataset.wear) { const o = owned[b.dataset.wear]; o.worn = o.worn === false; lookDirty = true; dressUp(); renderDetail(); }
    if (b.dataset.color) { owned[b.dataset.color].color = b.dataset.c || null; lookDirty = true; dressUp(); renderDetail(); }
    if (b.dataset.paint) { if (b.dataset.c) look.paint[b.dataset.paint] = b.dataset.c; else delete look.paint[b.dataset.paint]; lookDirty = true; dressUp(); renderDetail(); }
  });

  // ---------------------------------------------------------------- account
  function openSignIn() {
    const list = String((SITE.online || {}).providers || "discord").split(/[\s,]+/).filter(p => PROV[p]);
    $("provs").innerHTML = list.map(p => `<button class="prov" type="button" data-p="${p}"><span style="width:14px;height:14px;border-radius:50%;background:${PROV[p][1]};border:2px solid #0a0f1f"></span>${PROV[p][0]}</button>`).join("");
    $("signin").hidden = false; $("provs").querySelector("button")?.focus();
  }
  $("provs").addEventListener("click", async ev => {
    const b = ev.target.closest("[data-p]"); if (!b || !sb) return;
    const { error } = await sb.auth.signInWithOAuth({ provider: b.dataset.p, options: { redirectTo: location.origin + location.pathname } });
    if (error) toast(error.message, 4000);
  });
  $("signClose").onclick = () => { $("signin").hidden = true; };
  $("signin").addEventListener("click", ev => { if (ev.target === $("signin")) $("signin").hidden = true; });
  addEventListener("keydown", ev => { if (ev.key === "Escape") $("signin").hidden = true; });
  $("who").onclick = async () => {
    if (!sb) return toast("Sign-in isn't set up yet");
    if (!user) return openSignIn();
    if (confirmOut()) { await sb.auth.signOut(); user = null; me = { coins: null, aura: 0 }; owned = {}; loot = []; links = []; code = null; look = { paint: {} }; lookDirty = false; paintMe(); renderMenu(); dressUp(); }
  };
  function confirmOut() { return window.confirm("Sign out of the Spooners Hub?"); }
  function nameOf(u) { const m = (u && u.user_metadata) || {}; return m.custom_claims?.global_name || m.full_name || m.name || m.user_name || (u && u.email ? u.email.split("@")[0] : "Spooner"); }
  function paintMe() {
    $("coins").textContent = me.coins == null ? "–" : nf(me.coins);
    $("aura").textContent = user ? String(me.aura || 0) : "–";
    $("whoTxt").textContent = user ? "SIGN OUT" : "SIGN IN";
    $("pname").textContent = user ? nameOf(user).toUpperCase().slice(0, 18) : "GUEST";
    if (ECON && me.rank_name != null) {
      const ranks = ECON.aura_ranks || [], r = me.rank || 0, cur = (ranks[r] || {}).points || 0, nxt = ranks[r + 1];
      $("prank").textContent = user ? `LV ${me.level || 1} · ${String(me.rank_name).toUpperCase()} AURA` : "SIGN IN TO COLLECT COINS";

      $("auraBar").style.width = user ? (nxt ? Math.max(0, Math.min(100, Math.round(100 * ((me.aura || 0) - cur) / (nxt.points - cur)))) : 100) + "%" : "0%";
      return;
    }
    const rank = Math.floor((me.aura || 0) / 10), into = (me.aura || 0) % 10;
    $("prank").textContent = user ? "AURA RANK " + rank : "SIGN IN TO COLLECT COINS";
    $("auraNext").textContent = user ? `${10 - into} LEVELS TO RANK ${rank + 1}` : "";
    $("auraBar").style.width = user ? (into * 10) + "%" : "0%";
  }
  async function loadMe() {
    if (!user) return;
    const [a, o, l, k] = await Promise.all([
      sb.from("player_aura").select(ECON ? "coins,aura,level,rank,rank_name,streak,last_checkin" : "coins,aura").eq("id", user.id).maybeSingle(),
      sb.from("owned").select("item_id,level,worn,color").then(r => r.error ? sb.from("owned").select("item_id,level") : r),
      sb.from("raid_loot").select("boss,coins,chests,platform,won_at").order("won_at", { ascending: false }).limit(50),
      sb.from("linked_accounts").select("platform,login")
    ]);
    if (a.data) me = Object.assign({}, a.data);
    if (!lookDirty) {
      owned = Object.fromEntries((o.data || []).map(x => [x.item_id, x]));
      const pl = await sb.from("players").select("look").eq("id", user.id).maybeSingle();
      look = { paint: Object.assign({}, ((pl.data || {}).look || {}).paint || {}) };
    }
    loot = l.data || []; links = k.data || [];
    paintMe(); renderMenu(); dressUp();
  }
  async function claim(manual) {
    if (!user) return;
    const { data, error } = await sb.rpc("claim_loot");
    if (error) { toast(error.message, 4000); return; }
    const before = loot.length;
    await loadMe();
    if (data > 0) openChests(data, Math.max(1, loot.length - before)); else if (manual) toast("No new chests yet");
  }
  function openChests(total, wins) {
    const n = Math.min(3 * wins, 6), svg = `<svg viewBox="0 0 64 56" aria-hidden="true"><rect x="5" y="24" width="54" height="28" rx="4" fill="#1f56d6" stroke="#0a0f1f" stroke-width="3"/><rect x="5" y="31" width="54" height="5" fill="#ffd34d" stroke="#0a0f1f" stroke-width="2"/><rect x="28" y="28" width="8" height="12" rx="2" fill="#ffd34d" stroke="#0a0f1f" stroke-width="2"/><circle class="shine" cx="32" cy="22" r="16" fill="#fff3b0"/><g class="lid"><path d="M5 26V18a14 10 0 0114-10h26a14 10 0 0114 10v8z" fill="#2f73ff" stroke="#0a0f1f" stroke-width="3"/><path d="M14 9v17M50 9v17" stroke="#ffd34d" stroke-width="4"/></g></svg>`;
    $("chestRow").innerHTML = Array.from({ length: n }, (_, i) => `<div class="chest" style="animation-delay:${i * .12}s">${svg}</div>`).join("");
    $("chestTotal").textContent = ""; $("chests").hidden = false;
    [...$("chestRow").children].forEach((c, i) => setTimeout(() => c.classList.add("open"), 700 + i * 220));
    setTimeout(() => { $("chestTotal").textContent = "+" + nf(total) + " COINS"; }, 900 + n * 220);
    setTimeout(() => { $("chests").hidden = true; }, 3200 + n * 220);
  }
  async function checkin(btn) {
    if (!user) return; btn.disabled = true;
    const { data, error } = await sb.rpc("checkin");
    if (error) { toast(error.message, 3500); btn.disabled = false; return; }
    toast(`+${nf(data.coins)} coins · ${data.streak}-day streak`, 3200); await loadMe();
  }
  async function buy(id, btn) {
    const it = shop.find(x => x.id === id); if (!it || !user) return;
    if (!window.confirm(`Buy ${it.name} for ${nf(it.price)} coins?`)) return;
    btn.disabled = true;
    const { error } = await sb.rpc("buy_item", { item: id });
    if (error) { toast(error.message, 3500); btn.disabled = false; return; }
    toast("Bought " + it.name + "!"); await loadMe();
  }
  async function newCode() {
    const { data, error } = await sb.rpc("new_link_code");
    if (error) return toast(error.message, 4000);
    code = data; renderDetail();
    const known = links.length, until = Date.now() + 30 * 60e3;
    clearInterval(codeTimer);
    codeTimer = setInterval(async () => {
      if (Date.now() > until) { clearInterval(codeTimer); code = null; renderDetail(); return; }
      const { data: k } = await sb.from("linked_accounts").select("platform,login");
      if (k && k.length > known) { clearInterval(codeTimer); code = null; links = k; toast("Linked " + k[k.length - 1].login + "!"); await claim(false); renderMenu(); }
    }, 4000);
  }

  // ---------------------------------------------------------------- start
  function applySite() {
    const hub = SITE.hub || {};
    ENTRIES = Array.isArray(hub.entries) && hub.entries.length ? hub.entries : DEFAULT_ENTRIES;
    $("word").textContent = hub.title || "SPOONERS";
    $("foot").textContent = (SITE.community || "") + (SITE.channel ? " · " + SITE.channel : "");
    renderLatest();
  }
  // the newest Spooners update from Cutroom › Webpage › News & updates
  function renderLatest() {
    const box = $("latest"); if (!box) return;
    const ups = (SITE.posts || []).filter(p => p && p.kind === "update" && (p.title || p.text)).sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
    const p = ups[0]; box.hidden = !p; if (!p) return;
    const dt = /^\d{4}-\d{2}-\d{2}$/.test(p.date || "") ? new Date(p.date + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }).toUpperCase() : "";
    const link = /^https?:\/\//i.test(String(p.link || "").trim()) ? String(p.link).trim() : "";
    box.innerHTML = `<div><div class="k"><span>LATEST UPDATE</span><span>${esc(dt)}</span></div>${p.title ? `<h3>${esc(p.title)}</h3>` : ""}` +
      `${p.text ? `<p>${esc(p.text)}</p>` : ""}<div class="row2">${String(p.text || "").length > 140 || /\n.*\n.*\n/.test(p.text || "") ? '<button class="more" type="button" aria-expanded="false">SHOW ALL</button>' : ""}` +
      `${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Read more →</a>` : ""}</div></div>`;
    box.classList.remove("open");
  }
  $("latest").addEventListener("click", e => {
    const b = e.target.closest(".more"); if (!b) return;
    const open = $("latest").classList.toggle("open"); b.setAttribute("aria-expanded", open); b.textContent = open ? "SHOW LESS" : "SHOW ALL";
  });
  // Cutroom › Webpage preview: changes show as you type
  addEventListener("message", ev => { if (ev.origin !== location.origin || !ev.data || ev.data.type !== "site-data") return; SITE = ev.data.data || {}; applySite(); renderMenu(); });
  // ---------------------------------------------------------------- your Spooner (Cutroom copies the Workflow export to spooners/ when you publish)
  let SPD = null, puppet = null, spBox = null, dressKey = "";
  function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  async function loadSpooners() {
    try { await loadScript("spooners/spooner-player.js?v=15bdfb45"); await loadScript("spooners/spooners-data.js?v=2bec3745"); } catch (e) { return; }
    SPD = window.SPOONERS_DATA || null; if (!SPD || !window.SpoonerPlayer) return;
    await dressUp(); renderDetail();
  }
  function baseId() {
    const want = (SITE.hub || {}).base, ch = SPD.characters || {};
    if (want && ch[want]) return want;
    return Object.keys(ch).find(k => ch[k].base) || Object.keys(ch)[0];
  }
  async function dressUp() {
    if (!SPD) return;
    const base = baseId(); if (!base) return;
    const items = new Set((SPD.items || []).map(i => i.id)), worn = Object.keys(owned).filter(id => items.has(id) && owned[id].worn !== false);
    const equipped = worn.map(item => ({ item, color: owned[item].color ? { color: owned[item].color } : null }));
    const paint = Object.fromEntries(Object.entries(look.paint || {}).map(([k, c]) => [k, { color: c }]));
    const key = base + "|" + JSON.stringify(equipped) + JSON.stringify(paint); if (key === dressKey) return; dressKey = key;
    try {
      const p = await SpoonerPlayer.loadOutfit(SPD, { base, equipped, paint }, "spooners/");
      const SP = window.SpoonerPlayer, def = p.def, clip = (def.clips || {}).idle ? "idle" : Object.keys(def.clips || {})[0], pose = SP.poseAt(def, clip, 0), W = SP.world(def, pose, null);
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const L of def.layers) { const g = p.images[pose[L.id].img], m = W[L.id]; if (!g || !m || L.hidden) continue; const gw = g.naturalWidth || g.width, gh = g.naturalHeight || g.height; if (!gw) continue;
        const ps = L.ps || 1, w = gw * ps, h = gh * ps, ox = -(L.px || 0) * ps, oy = -(L.py || 0) * ps;
        for (const [x, y] of [[ox, oy], [ox + w, oy], [ox, oy + h], [ox + w, oy + h]]) { const X = m[0] * x + m[2] * y + m[4], Y = m[1] * x + m[3] * y + m[5]; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); } }
      spBox = x0 > x1 ? { cx: 0, bottom: 0, w: 200, h: 200 } : { cx: (x0 + x1) / 2, bottom: y1, w: x1 - x0, h: y1 - y0 };
      puppet = p; $("spc").hidden = false; $("spSvg").style.display = "none";
    } catch (e) { console.warn("Spooner didn't load", e); }
  }
  let spLast = 0;
  function spLoop(t) {
    requestAnimationFrame(spLoop);
    if (!puppet || document.hidden) { spLast = t; return; }
    const dt = Math.min(.05, (t - (spLast || t)) / 1000); spLast = t;
    puppet.update(dt);
    const c = $("spc"), x = c.getContext("2d"), b = spBox, k = Math.min((c.height - 30) / Math.max(1, b.h), (c.width - 40) / Math.max(1, b.w));
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height);
    puppet.draw(x, c.width / 2 - b.cx * k, c.height - 14 - b.bottom * k, k, false);
  }
  requestAnimationFrame(spLoop);
  $("spc").addEventListener("click", () => { if (puppet && puppet.has("cheer")) puppet.play("cheer", { restart: true }); });

  async function start() {
    try { SITE = await (await fetch("data/site.json", { cache: "no-cache" })).json(); } catch (e) { SITE = {}; }
    applySite();
    { const h = location.hash.slice(1), i = ENTRIES.filter(e => e.show !== false).findIndex(e => e.key === h); if (i >= 0) sel = i; }   // hub.html#shop opens the shop
    const on = SITE.online || {};

      const s = (await sb.auth.getSession()).data.session; user = s ? s.user : null;

      const ec = await sb.from("economy_config").select("config").eq("id", 1).maybeSingle();

      let res = await sb.from("shop_items").select(ECON ? "id,name,category,price,max_level,tier,min_level,unlocks,description" : "id,name,category,price,max_level").eq("active", true).order("price");
      if (res.error && ECON) { ECON = null; res = await sb.from("shop_items").select("id,name,category,price,max_level").eq("active", true).order("price"); }
      shop = res.data || [];
      if (user) await claim(false);
    }
    paintMe(); renderMenu();
    loadSpooners();
  }
  start();
})();
